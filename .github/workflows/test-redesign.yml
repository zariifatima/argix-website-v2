name: Test Argix redesign

on:
  push:
    branches:
      - ui-cybersecurity-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug navigation export
        run: |
          echo "=== Current commit ==="
          git rev-parse HEAD
          echo "=== Navigation declaration in siteData.js ==="
          grep -n -E 'nav|export' src/data/siteData.js | head -25
          echo "=== First 30 lines of siteData.js ==="
          sed -n '1,30p' src/data/siteData.js


      - name: Build website
        run: npm run build
        env:
          VITE_BASE: /argix-website-v2/
