name: Test Argix redesign

on:
  push:
    branches:
      - ui-cybersecurity-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify data exports and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared site data exports
        run: |
          node --input-type=module <<'NODE'
          import * as data from './src/data/siteData.js';

          const required = ['nav', 'services', 'industries', 'otherIndustries', 'EMAIL', 'WHATSAPP', 'LINKEDIN', 'INSTAGRAM', 'servicePath'];
          const missing = required.filter((name) => !(name in data));

          console.log('siteData.js exports:', Object.keys(data).sort().join(', '));
          if (missing.length) {
            console.error('Missing required exports:', missing.join(', '));
            process.exit(1);
          }
          if (!Array.isArray(data.nav) || !Array.isArray(data.services)) {
            console.error('Expected nav and services to be arrays.');
            process.exit(1);
          }
          console.log(`Validated ${data.nav.length} navigation links and ${data.services.length} services.`);
          NODE

      - name: Build website
        run: npm run build
        env:
          VITE_BASE: /argix-website-v2/
